name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Sin permisos de escritura: un PR malicioso no puede tocar nada del repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn typecheck

      - run: yarn build

      # El tarball que llegaría a npm: solo dist, README y LICENSE.
      - run: npm pack --dry-run

name: Publish

# Se dispara solo con un tag vX.Y.Z creado por el dueño del repo.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC: trusted publishing + provenance, sin NPM_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: yarn

      # Trusted publishing exige npm >= 11.5.1; setup-node trae uno más viejo.
      - run: npm install -g npm@latest

      - run: yarn install --frozen-lockfile

      - run: yarn typecheck

      - run: yarn build

      # El tag debe coincidir con la versión del package.json.
      - name: Verificar que el tag y package.json coincidan
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $tag != package.json $pkg" >&2
            exit 1
          fi

      - run: npm publish --provenance --access public
